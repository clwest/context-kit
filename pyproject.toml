[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
# PyPI distribution name. The CLI command is still `context-kit` and
# the GitHub repo is still `clwest/context-kit` — only the distribution
# name is namespaced because PyPI rejected `context-kit` as too similar
# to an existing project.
name = "contextkit-ai"
version = "0.16.0"
description = "Bootstrap tool for AI-assisted projects that preserves context across sessions, prevents doc drift, and scaffolds a memory layer around your code."
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT" }
authors = [
    { name = "Chris", email = "chris@context-kit.com" },
]
maintainers = [
    { name = "Chris", email = "chris@context-kit.com" },
]
keywords = [
    "ai",
    "llm",
    "claude",
    "bootstrap",
    "scaffold",
    "documentation",
    "pair-programming",
    "drift-detection",
    "context",
]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Software Development :: Code Generators",
    "Topic :: Software Development :: Documentation",
]
# Zero runtime dependencies by design.
dependencies = []

# Development-time tools only. The CLI itself never imports these.
# Install with: ``pip install -e ".[dev]"``.
[project.optional-dependencies]
dev = [
    "ruff>=0.5",
]

[project.scripts]
context-kit = "context_kit:main"

[project.urls]
Homepage = "https://github.com/clwest/context-kit"
Repository = "https://github.com/clwest/context-kit"
Issues = "https://github.com/clwest/context-kit/issues"
Changelog = "https://github.com/clwest/context-kit/blob/main/CHANGELOG.md"

[tool.setuptools]
# The CLI entry point lives at the top level as a single-file module, and
# the subcommand implementations live in the ``cli`` package. Subpackages
# of ``cli`` (currently ``cli._refactor``) must be listed explicitly —
# setuptools does not auto-discover them when ``packages`` is a literal list.
py-modules = ["context_kit"]
packages = ["cli", "cli._refactor"]
include-package-data = true

# All starter, pattern, and skill assets live inside the ``cli`` package
# under ``_starter/``, ``_pattern/``, and ``_skills/``. They ship in the
# wheel via the explicit globs below and are read at runtime via
# ``importlib.resources`` (see cli/bootstrap.py). Editable installs work
# the same way because importlib.resources sees the in-place tree.

[tool.setuptools.package-data]
cli = [
    "_pattern/*.md",
    "_pattern/templates/*",
    "_starter/root/*",
    "_starter/docs/*",
    "_starter/docs/topics/*",
    "_starter/docs/handoffs/*",
    "_starter/scaffold/python/*",
    "_skills/context-kit/*",
    "_skills/context-kit-guardrails/*",
    "_static/*",
    "_static/guardrails/*",
]

# ---------------------------------------------------------------------------
# Ruff — deliberately-conservative quality gate.
#
# Selected rule groups:
#   E    pycodestyle errors        (real style issues, not line-length)
#   F    pyflakes                  (undefined names, unused imports, F-strings)
#   W    pycodestyle warnings      (trailing whitespace, invalid escapes, etc.)
#
# Deliberately NOT selected:
#   E501 line-too-long             — 1400+ historical hits; enforcing it now
#                                    would trigger a giant cosmetic rewrite
#                                    for no correctness benefit.
#   I    unsorted-imports          — pre-existing import ordering; not worth
#                                    the churn today, revisit as a P2 item.
#   UP   pyupgrade                 — many would rewrite ``Optional[X]`` to
#                                    ``X | None`` which we can't do while
#                                    supporting Python 3.9.
#   B    bug-bear                  — mostly opinionated; consider later.
#
# Run:
#   ruff check .           (verify)
#   ruff check --fix .     (auto-fix the safe ones)
# ---------------------------------------------------------------------------
[tool.ruff]
target-version = "py39"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "W"]
ignore = ["E501"]

[tool.ruff.lint.per-file-ignores]
# Test-only fixtures may re-import symbols under different names.
"tests/*" = ["F401"]
