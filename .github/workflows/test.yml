name: tests

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

jobs:
  # Matrix rationale:
  #   * Ubuntu across every supported Python (3.9-3.12): the CLI's main
  #     target platform; wide Python coverage catches syntax/stdlib regressions.
  #   * macOS + Windows on the latest supported Python: this is a cross-
  #     platform CLI that shells out to git and touches the filesystem;
  #     one job per OS is enough to catch path-handling / subprocess drift
  #     without paying for a 12-job Cartesian matrix on every push.
  test:
    name: ${{ matrix.os }} · Python ${{ matrix.python-version }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - {os: ubuntu-latest, python-version: "3.9"}
          - {os: ubuntu-latest, python-version: "3.10"}
          - {os: ubuntu-latest, python-version: "3.11"}
          - {os: ubuntu-latest, python-version: "3.12"}
          - {os: macos-latest,  python-version: "3.12"}
          - {os: windows-latest, python-version: "3.12"}

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      # context-kit has zero runtime dependencies and tests use only stdlib,
      # so no `pip install` step is required. Tests import from the repo root
      # via tests/__init__.py + sys.path insertion.
      - name: Run tests
        run: python -m unittest discover -s tests -t . -v

  lint:
    name: lint (ruff)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install ruff
        run: pip install "ruff>=0.5"

      - name: Ruff check
        run: ruff check .
